services:
  # ── Eureka Service Registry ──────────────────────────────────
  # Must start BEFORE any service that registers with it.
  # Other services use depends_on to wait for Eureka's healthcheck.
  eureka-server:
    build:
      # Context must be the project root so Docker can access
      # both the parent POM and the eureka-server subdirectory.
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: ops-eureka
    # 8761 → convention port. Maps container port to host port
    # so you can access the dashboard at http://localhost:8761
    ports:
      - "8761:8761"
    healthcheck:
      # Eureka exposes a health endpoint via Spring Boot Actuator.
      # We use wget instead of curl because our base image (eclipse-temurin)
      # doesn't include curl by default.
      #
      # The /actuator/health endpoint returns {"status":"UP"} when ready.
      # We check this to know when Eureka is truly ready to accept registrations.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ops-network

  mysql:
    image: mysql:8
    container_name: ops-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?error}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?error}
      MYSQL_USER: ${MYSQL_USER:?error}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?error}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ops-network

 # ── RabbitMQ 3 with Management UI ──────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ops-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port (your app connects here)
      - "15672:15672"   # Management UI (you browse here)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?error}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?error}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ops-network

  # ── API Gateway ──────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ops-gateway
    ports:
      # 8080 is now the ONLY port clients connect to.
      - "8080:8080"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?error}
      EUREKA_URI: http://ops-eureka:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ops-network

  # ── Auth Service ─────────────────────────────────────────────
  ops-auth:
    build:
      context: .
      dockerfile: ops-auth/Dockerfile
    container_name: ops-auth
    ports:
      # Internal port — not client-facing. Exposed for debugging.
      - "8070:8070"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?error}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?error}
      MYSQL_USER: ${MYSQL_USER:?error}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?error}
      EUREKA_URI: http://ops-eureka:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8070/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ops-network

  # ── OPS Monolith ────────────────────────────────────────────
  ops-monolith:
    build:
      context: .
      dockerfile: ops-monolith/Dockerfile
    container_name: ops-monolith
    ports:
      # Internal port — not client-facing. Exposed for debugging.
      - "8888:8888"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?error}
      MYSQL_USER: ${MYSQL_USER:?error}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?error}
      EUREKA_URI: http://ops-eureka:8761/eureka
      SPRING_RABBITMQ_HOST: ops-rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?error}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?error}
      SPRING_MAIL_HOST: ops-mailhog
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ops-network

 # ── MailHog (optional — development email testing) ─────────────
  mailhog:
    image: mailhog/mailhog
    container_name: ops-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ops-network

# ── Named Volumes ─────────────────────────────────────────────────
# Declared here so Docker manages their lifecycle independently
# of the containers. Data survives container recreation.
volumes:
  mysql_data:
  rabbitmq_data:

# ── Shared Network ─────────────────────────────────────────────
# All services on the same bridge network can reach each other
# by container name (e.g., "ops-eureka", "ops-mysql").
# This is how the monolith finds Eureka inside Docker.
networks:
  ops-network:
    driver: bridge